---

# Create a Forgejo release when a release/* branch is merged to main, by
# calling the reusable workflow in psa-systems/common. The release logic,
# including the changelog format, lives there and is shared by every consumer.
#
# `runs-on` is set on this caller job, not left to the reusable workflow: this
# Forgejo does not carry a caller's `${{ vars.* }}` into the expanded job's
# runs-on, so the label must resolve here. MEDIUM is correct: the job runs git
# and the Forgejo API, it compiles nothing (DEV-769).
#
# `secrets: inherit` is required. A called workflow receives no secret it is
# not passed, and the release POST needs FORGEJO_PAT (write:repository).
name: Create release

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    uses: psa-systems/common/.forgejo/workflows/create-release.yml@main
    # MEDIUM: git and API calls only (see header).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    secrets: inherit
