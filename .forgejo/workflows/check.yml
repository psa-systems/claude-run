---

# Validate code on every push and pull request.
# Mirrors the local `just check` recipe (the `claude-md` job is its
# `check-claude-md` step, CLAUDE-370). This stays a standalone workflow rather
# than calling common's reusable check.yml: that workflow cannot declare the
# PostgreSQL service or run the suite a second time against it (CLAUDE-250).
#
# CLAUDE-570: whether a pull request needs the compile and test work is
# decided only by common's shared `classify-diff` action (common STD-3.1,
# STD-3.2; PC-134): `code` runs everything, `comments-only` runs `cargo fmt
# --check` and skips clippy, build and tests, `non-code` (docs and their
# assets) skips the compile job. A push is always `code`. This is NOT a
# workflow-level `paths-ignore` (CLAUDE-286): Forgejo drops a workflow whose
# path filter does not match before any run is created, so no status is
# posted and branch protection's required context stays `pending` forever.
# Instead the `changes` job always runs (on the cheap base runner) and the
# compile job's own `if:` skips it; a skipped job still posts commit status
# `skipped`, which satisfies the required check.
name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: classify changed files
    # MEDIUM: only reads the diff, compiles nothing (DEV-769).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    outputs:
      # `code`, `comments-only` or `non-code` (CLAUDE-570).
      result: ${{ steps.classify.outputs.result }}
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Classify the diff
        id: classify
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/classify-diff@main

  claude-md:
    # CLAUDE-370: runs on every push and PR, docs-only ones included, since
    # CLAUDE.md growth is exactly what a docs-only change can introduce.
    name: CLAUDE.md guard
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Guard self-test
        run: nu scripts/check-claude-md.nu --self-test

      - name: Guard CLAUDE.md size, line length and docs/ links
        run: nu scripts/check-claude-md.nu

  check:
    needs: changes
    # CLAUDE-570: skipped for a `non-code` diff; for `comments-only` only the
    # formatting check runs (the steps below gate on `code`). The CLAUDE.md
    # guard and secrets scan run unconditionally.
    if: needs.changes.outputs.result != 'non-code'
    name: fmt + clippy + build + tests
    # HEAVY: compiles natively and needs the dev image's `cc` for crate build
    # scripts (CLAUDE-203, DEV-769).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_HEAVY }}

    # CLAUDE-250: the runner supports SQLite and PostgreSQL through one sqlx
    # `Any` pool, so the suite runs twice: once on the default SQLite and once
    # against a real PostgreSQL. Without it the Postgres half of the dialect
    # chokepoint would only ever be exercised in principle.
    #
    # CLAUDE-543: the PostgreSQL pass runs on a throwaway, non-durable
    # Postgres started by `claude-run test-postgres --network` on this job's
    # own Docker network (SPEC-6.6, SPEC-11.1), not on a service container: a
    # service's `options` cannot turn off fsync, on this runner's busy array a
    # durable server made the pass take an hour (run #764, 3735 s) where the
    # non-durable one took about 5 minutes (run #766), and the postgres 18
    # image refuses to start with a tmpfs at /var/lib/postgresql/data (run
    # #815). That is not a timeout, retry or skip (SPEC-10.1.3); it only keeps
    # the test database off the disk the build shares with everything else.
    # The timeouts end a stall in minutes rather than at the 3 hour limit.
    #
    # CLAUDE-627: raised from 90 to 120 minutes alongside the Postgres step's
    # own 45-to-75-minute raise below, so the job itself cannot time out
    # before that step's longer budget runs out.
    timeout-minutes: 120
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Take build parallelism from the runner
        # Exports CARGO_BUILD_JOBS / NEXTEST_TEST_THREADS / CI_JOBS; warns and
        # falls back to a low CPU-derived value when the runner did not set them (DEV-769).
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/build-parallelism@main

      - name: Start job metrics sampler
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-start@main

      - name: Resolve RUST_TEST_THREADS from NEXTEST_TEST_THREADS
        # libtest reads RUST_TEST_THREADS, but only cargo-nextest reads
        # NEXTEST_TEST_THREADS (set above), so without this `cargo test` fans
        # its harness out over every CPU of the HEAVY runner instead of this
        # job's share of it. Unbounded, the Postgres step below runs far more
        # concurrent tests than the one shared Postgres can hold connections
        # for, which is what produced the Sqlx(PoolTimedOut)
        # failures in run #641.
        #
        # Capped at 8 for the SQLite leg too (SPEC-5.6.10, CLAUDE-524): its
        # test_sqlite_pool() fixtures are single-connection pools with a 120s
        # acquire_timeout that tolerates a CPU-starved background rollback,
        # but that tolerance has a limit, and this issue already showed on
        # the Postgres leg that a raised timeout plus an uncapped (or loosely
        # capped) thread count still starves a sibling test's own acquire
        # under real CPU contention (cap had to come down from 16 to 8 there).
        # The SQLite leg carries the identical starvation mechanism, so it
        # gets the same cap rather than being left to scale unbounded off
        # CI_JOBS via NEXTEST_TEST_THREADS. Otherwise mirrors the mapping in
        # common/.forgejo/actions/check-rust/action.yml.
        shell: nu {0}
        run: |
          if "RUST_TEST_THREADS" not-in $env and "NEXTEST_TEST_THREADS" in $env {
              let threads = ([($env.NEXTEST_TEST_THREADS | into int) 8] | math min)
              $"RUST_TEST_THREADS=($threads)\n" | save --append $env.GITHUB_ENV
          }

      # CLAUDE-559: per-phase timing + target-cache size snapshots so a PR run
      # surfaces where the SQLite leg's 40+ minutes go beyond the suite's own
      # ~34s wall-clock. Forgejo's UI already prints each step's duration but
      # does not break down compile vs test inside a step, and `job-metrics-report`
      # is aggregate; these explicit markers give grep-able anchors in the log.
      - name: Check formatting
        shell: nu {0}
        run: |
          print $"TIMING ($env.NU_VERSION): fmt-start ((date now | format date '%+'))"
          cargo fmt --all --check
          print $"TIMING: fmt-end ((date now | format date '%+'))"

      - name: Clippy
        if: needs.changes.outputs.result == 'code'
        shell: nu {0}
        run: |
          print $"TIMING: clippy-start ((date now | format date '%+'))"
          if ("target" | path exists) {
            let size = (du target | get apparent | math sum)
            print $"TIMING: target-cache-size-before-clippy ($size) bytes"
          }
          cargo clippy --all-targets -- -D warnings
          print $"TIMING: clippy-end ((date now | format date '%+'))"

      - name: Build
        if: needs.changes.outputs.result == 'code'
        shell: nu {0}
        run: |
          print $"TIMING: build-start ((date now | format date '%+'))"
          cargo build --all-targets
          print $"TIMING: build-end ((date now | format date '%+'))"
          let size = (du target | get apparent | math sum)
          print $"TIMING: target-cache-size-after-build ($size) bytes"

      - name: Unit tests (SQLite, the default backend)
        if: needs.changes.outputs.result == 'code'
        timeout-minutes: 30
        shell: nu {0}
        run: |
          print $"TIMING: sqlite-tests-start ((date now | format date '%+'))"
          cargo test
          print $"TIMING: sqlite-tests-end ((date now | format date '%+'))"

      - name: Unit tests (PostgreSQL)
        if: needs.changes.outputs.result == 'code'
        # SPEC-6.6, SPEC-11.1: `claude-run test-postgres` starts a throwaway
        # Postgres with fsync, synchronous_commit and full_page_writes off and
        # sets CLAUDE_RUN_TEST_DATABASE_URL for the command only, so the SQLite
        # step above still runs on SQLite. The job runs in a container on its
        # own per-job network, out of reach of a port published on the Docker
        # host, so Postgres joins that network (`--network`), read off this
        # job's container, which the runner names in JOB_CONTAINER_NAME
        # (Forgejo leaves `job.container.network` empty).
        #
        # CLAUDE-540: only the test files that touch a DB pool are re-run here
        # (scripts/postgres-test-filters.txt, enforced by the db.rs guard
        # test); the pure-logic tests already ran on the SQLite leg above and
        # would do identical, SQL-free work on Postgres. This leg is DB/IO-
        # bound once per-test setup is a block-copy clone, so it oversubscribes
        # the job's CPU share (CI_JOBS, which the build-parallelism action can
        # floor at nproc/4 = 2): the test threads mostly wait on Postgres, so
        # running several per core overlaps that wait. The thread count is
        # capped at 8 regardless of CI_JOBS (SPEC-5.6.9, CLAUDE-524): each test's fixture
        # pool can hold up to 4 connections, so 8 threads cannot ask
        # test-postgres for more than 32 at once, leaving headroom under its
        # max_connections=200. Before the first cap (16), an 8-job HEAVY
        # runner produced 32 threads (32 * 4 = 128) worth of connection
        # demand; a cap of 16 still left 13 tests timing out acquiring from
        # their OWN per-test pool (size 4, idle 0) on a HEAVY runner under
        # heavy load (CI run #774): the connection ceiling was not the limit
        # there, CPU contention between 16 threads was, delaying each test's
        # own queries long enough to starve its sibling tasks on the same
        # 4-connection pool past even the 120s acquire_timeout. Halving the
        # thread count halves that CPU contention.
        #
        # CLAUDE-627: raised from 45 to 75 minutes after a CPU-starved runner
        # (average 0.24 cores, high memory pressure) hit the 45 minute step
        # timeout exactly, failing the job with a copy-out error rather than a
        # real test failure.
        timeout-minutes: 75
        shell: nu {0}
        run: |
          print $"TIMING: postgres-tests-start ((date now | format date '%+'))"
          let me = ($env.JOB_CONTAINER_NAME? | default "")
          if ($me | is-empty) {
              error make {msg: "JOB_CONTAINER_NAME is not set, so this job's Docker network cannot be found"}
          }
          let found = (^docker inspect --format "{{json .NetworkSettings.Networks}}" $me | complete)
          if $found.exit_code != 0 {
              error make {msg: $"docker inspect ($me) failed: ($found.stderr)"}
          }
          let network = ($found.stdout | from json | columns | where {|n| $n not-in [bridge host none] } | get 0? | default "")
          if ($network | is-empty) {
              error make {msg: $"($me) is on no user-defined Docker network"}
          }
          let filters = (
              open scripts/postgres-test-filters.txt
              | lines
              | each {|line| $line | str trim}
              | where {|line| ($line | is-not-empty) and (not ($line | str starts-with "#"))}
          )
          let ci_jobs = ($env.CI_JOBS? | default "2" | into int)
          let uncapped = ([($ci_jobs * 4) 8] | math max)
          let threads = ([$uncapped 8] | math min)
          print $"test-postgres on network ($network); test threads: ($threads); filters: ($filters)"
          ^cargo run -- test-postgres --network $network -- cargo test -- --test-threads $threads ...$filters
          print $"TIMING: postgres-tests-end ((date now | format date '%+'))"

      - name: Report job metrics
        # Last and always(), so a failing job still reports (composite actions have no post hook).
        if: always()
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-report@main

  secrets:
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    steps:
      - name: Rename .gitconfig
        # The runner's ~/.gitconfig prevents actions/checkout from working.
        shell: nu {0}
        run: |
          let gitconfig = ([$env.HOME .gitconfig] | path join)
          if ($gitconfig | path expand | path exists) {
            mv $gitconfig ([$gitconfig 'disabled'] | str join '-')
          }

      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secrets scan
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/check-secrets@main
        with:
          # Placeholder credentials only, also present in git history: the CI
          # former CI Postgres service password, the docs/configuration.md and compose.yml example
          # URIs, the token-shaped remote URLs in src/ tests, the nu
          # interpolation in the removed scripts/claude-run.nu, and the
          # retry_git_network redaction test's placeholder URL (CLAUDE-396,
          # still present in this branch's history even after the test
          # itself moved to an already-allowlisted shape).
          kingfisher_skip_regex: 'claude_run:(claude_run|secret|\(\$password\)|<that password>)@|^x-access-token$|oauth2:(secret|tok|tok-123|\(\$pat\))@|ghp_(secret|from_login|action)@|user:s3cr3t@'
