---

# Validate code on every push and pull request.
# Mirrors the local `just check` recipe (the `claude-md` job is its
# `check-claude-md` step, CLAUDE-370). This stays a standalone workflow rather
# than calling common's reusable check.yml: that workflow cannot declare the
# PostgreSQL service or run the suite a second time against it (CLAUDE-250).
#
# CLAUDE-286: the compile job is skipped when a push or pull request changes
# only documentation (docs/**, README.md, CLAUDE.md). This is NOT a workflow-
# level `paths-ignore`: Forgejo drops a workflow whose path filter does not
# match before any run is created, so no status is posted, and branch
# protection's required context pattern stays `pending` forever, blocking
# every docs-only PR. Instead the `changes` job always runs (on the cheap base
# runner) and the compile job's own `if:` skips it; a skipped job still posts
# commit status `skipped`, which outranks `success` and satisfies the
# required check.
name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: classify changed files
    # MEDIUM: only diffs file paths, compiles nothing (DEV-769).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: nu {0}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          let event = $env.EVENT_NAME
          let base_ref = $env.BASE_REF
          let before = $env.BEFORE

          def is_doc [path: string] {
              ($path starts-with "docs/") or ($path == "README.md") or ($path == "CLAUDE.md")
          }

          def diff_names [range: string] {
              let result = (^git diff --name-only $range | complete)
              if $result.exit_code != 0 {
                  print --stderr $result.stderr
                  exit 1
              }
              $result.stdout | lines | where {|it| $it != ""}
          }

          # push events where `before` is empty or all-zeros have no previous
          # commit to diff against (e.g. the branch's first push); treat that
          # as a code change rather than guessing.
          let no_previous_commit = (
              $event == "push"
              and (($before | is-empty) or ($before == "0000000000000000000000000000000000000000"))
          )

          let changed = if $no_previous_commit {
              []
          } else if $event == "pull_request" {
              let fetch = (^git fetch origin $base_ref | complete)
              if $fetch.exit_code != 0 {
                  print --stderr $fetch.stderr
                  exit 1
              }
              # Three-dot diff against the merge base, matching Forgejo's own
              # path-filter semantics.
              diff_names "FETCH_HEAD...HEAD"
          } else {
              diff_names $"($before)...HEAD"
          }

          let code = if $no_previous_commit {
              print "push event has no previous commit \(before is empty/all-zeros\); treating as code"
              true
          } else if ($changed | is-empty) {
              true
          } else {
              not ($changed | all {|p| is_doc $p})
          }

          print $"changed files: ($changed)"
          print $"code=($code)"
          $"code=($code)\n" | save --append $env.GITHUB_OUTPUT

  claude-md:
    # CLAUDE-370: runs on every push and PR, docs-only ones included, since
    # CLAUDE.md growth is exactly what a docs-only change can introduce.
    name: CLAUDE.md guard
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Guard self-test
        run: nu scripts/check-claude-md.nu --self-test

      - name: Guard CLAUDE.md size, line length and docs/ links
        run: nu scripts/check-claude-md.nu

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: fmt + clippy + build + tests
    # HEAVY: compiles natively and needs the dev image's `cc` for crate build
    # scripts (CLAUDE-203, DEV-769).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_HEAVY }}

    # CLAUDE-250: the runner supports SQLite and PostgreSQL through one sqlx
    # `Any` pool, so the suite runs twice: once on the default SQLite and once
    # against a real PostgreSQL. Without it the Postgres half of the dialect
    # chokepoint would only ever be exercised in principle.
    #
    # CLAUDE-528, revised by CLAUDE-540: a Forgejo-managed `services: postgres`
    # container, reached from this job's own container by the service name
    # `postgres` on 5432 (Forgejo wires services onto the job network with DNS
    # by name). CLAUDE-528 had avoided a service and started a throwaway
    # non-durable Postgres via `claude-run test-postgres`, because a service's
    # `options` cannot carry a server flag like `-c fsync=off` and a durable
    # (fsync-on) server paid a per-test commit-flush cost SPEC-10.1.3 called
    # out. CLAUDE-540 makes that cost negligible: each fixture now clones a
    # template database (a block copy) instead of replaying the migration set,
    # so per-test setup barely touches disk and fsync-on is affordable. The
    # self-started `test-postgres` path cannot be used from CI anyway: this
    # runner's Docker is a REMOTE daemon (`DOCKER_HOST` points at a separate
    # dind host), so a container it starts is not on this job's network and the
    # job cannot connect to it (runs #743-#745). `claude-run test-postgres`
    # stays the LOCAL dev path (SPEC-6.6), where Docker is local and reachable.
    services:
      postgres:
        image: docker.io/postgres:18.4-alpine3.23
        env:
          POSTGRES_USER: claude_run
          POSTGRES_PASSWORD: claude_run
          POSTGRES_DB: claude_run
        # The retries are generous because a loaded runner starts the job
        # container minutes after the service: run #747 failed with "container
        # health check ... is not healthy" before a single check ran, the same
        # shape as mirzam's MIRZAM-242. The start period keeps the first probes
        # of a database still recovering from initdb out of the count.
        options: >-
          --health-cmd "pg_isready --username=claude_run --dbname=claude_run"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 30s
          --health-retries 24
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Take build parallelism from the runner
        # Exports CARGO_BUILD_JOBS / NEXTEST_TEST_THREADS / CI_JOBS; warns and
        # falls back to a low CPU-derived value when the runner did not set them (DEV-769).
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/build-parallelism@main

      - name: Start job metrics sampler
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-start@main

      - name: Resolve RUST_TEST_THREADS from NEXTEST_TEST_THREADS
        # libtest reads RUST_TEST_THREADS, but only cargo-nextest reads
        # NEXTEST_TEST_THREADS (set above), so without this `cargo test` fans
        # its harness out over every CPU of the HEAVY runner instead of this
        # job's share of it. Unbounded, the Postgres step below runs far more
        # concurrent tests than the one shared Postgres can hold connections
        # for, which is what produced the Sqlx(PoolTimedOut)
        # failures in run #641. Mirrors the same mapping in
        # common/.forgejo/actions/check-rust/action.yml.
        shell: nu {0}
        run: |
          if "RUST_TEST_THREADS" not-in $env and "NEXTEST_TEST_THREADS" in $env {
              $"RUST_TEST_THREADS=($env.NEXTEST_TEST_THREADS)\n" | save --append $env.GITHUB_ENV
          }

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Unit tests (SQLite, the default backend)
        run: cargo test

      - name: Unit tests (PostgreSQL)
        # Runs the fixtures against the managed `postgres` service.
        # CLAUDE_RUN_TEST_DATABASE_URL is set only on THIS step (not the job),
        # so the SQLite step above still runs on SQLite; here it switches every
        # fixture onto Postgres, each test in a disposable database cloned from
        # a per-process template (SPEC-5.6, CLAUDE-540). The URL names the
        # service's own database as the maintenance database the CREATE/DROP
        # DATABASE statements run on.
        #
        # CLAUDE-540: only the test files that touch a DB pool are re-run here
        # (scripts/postgres-test-filters.txt, enforced by the db.rs guard
        # test); the pure-logic tests already ran on the SQLite leg above and
        # would do identical, SQL-free work on Postgres. This leg is DB/IO-
        # bound once per-test setup is a block-copy clone, so it oversubscribes
        # the job's CPU share (CI_JOBS, which the build-parallelism action can
        # floor at nproc/4 = 2): the test threads mostly wait on Postgres, so
        # running several per core overlaps that wait. The thread count is
        # capped at 16 regardless of CI_JOBS (CLAUDE-524): each test's fixture
        # pool can hold up to 4 connections, so 16 threads cannot ask the
        # service for more than 64 at once, leaving headroom under its
        # unconfigured default max_connections of 100 even with the drop
        # worker and template-clone connections added in. Before the cap, an
        # 8-job HEAVY runner produced 32 threads (32 * 4 = 128), over that
        # ceiling; sqlx's connect retry loop treats Postgres's connection-limit
        # refusal as transient and retries it silently, so the exhaustion
        # surfaced only as a bare PoolTimedOut once acquire_timeout elapsed.
        shell: nu {0}
        env:
          CLAUDE_RUN_TEST_DATABASE_URL: postgres://claude_run:claude_run@postgres:5432/claude_run
        run: |
          let filters = (
              open scripts/postgres-test-filters.txt
              | lines
              | each {|line| $line | str trim}
              | where {|line| ($line | is-not-empty) and (not ($line | str starts-with "#"))}
          )
          let ci_jobs = ($env.CI_JOBS? | default "2" | into int)
          let uncapped = ([($ci_jobs * 4) 8] | math max)
          let threads = ([$uncapped 16] | math min)
          print $"postgres test threads: ($threads); filters: ($filters)"
          cargo test -- --test-threads $threads ...$filters

      - name: Report job metrics
        # Last and always(), so a failing job still reports (composite actions have no post hook).
        if: always()
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-report@main

  secrets:
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    steps:
      - name: Rename .gitconfig
        # The runner's ~/.gitconfig prevents actions/checkout from working.
        shell: nu {0}
        run: |
          let gitconfig = ([$env.HOME .gitconfig] | path join)
          if ($gitconfig | path expand | path exists) {
            mv $gitconfig ([$gitconfig 'disabled'] | str join '-')
          }

      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secrets scan
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/check-secrets@main
        with:
          # Placeholder credentials only, also present in git history: the CI
          # former CI Postgres service password, the docs/configuration.md and compose.yml example
          # URIs, the token-shaped remote URLs in src/ tests, the nu
          # interpolation in the removed scripts/claude-run.nu, and the
          # retry_git_network redaction test's placeholder URL (CLAUDE-396,
          # still present in this branch's history even after the test
          # itself moved to an already-allowlisted shape).
          kingfisher_skip_regex: 'claude_run:(claude_run|secret|\(\$password\)|<that password>)@|^x-access-token$|oauth2:(secret|tok|tok-123|\(\$pat\))@|ghp_(secret|from_login|action)@|user:s3cr3t@'
