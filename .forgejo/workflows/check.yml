---

# Validate code on every push and pull request.
# Mirrors the local `just check` recipe. This stays a standalone workflow rather
# than calling common's reusable check.yml, which hardcodes `cargo test --bins`
# and would skip this crate's library-target unit tests; see PC-6.
name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: fmt + clippy + build + tests
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see CI.md "Concurrency cap").
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Unit tests
        run: cargo test
