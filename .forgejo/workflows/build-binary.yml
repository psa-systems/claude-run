---

# Build the static claude-run binary in Docker and publish it to Generic
# Packages on every push to main / tag; the Dockerfile's builder stage handles
# the musl cross-compile. CLAUDE-94: the runtime image publish lives in its own
# workflow (`.forgejo/workflows/build-image.yml`); this workflow ends after
# printing the Generic Package URLs.
name: Build binary

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "src/**"
      - "migrations/**"
      - "templates/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "oci-build/**"
      - ".forgejo/workflows/build-binary.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, compute URLs and print every registry action without mutating the registry"
        type: boolean
        default: true
      simulate_tag:
        description: "Version like v9.9.9 to exercise the release publish path; empty exercises latest"
        type: string
        default: ""

jobs:
  build-and-publish:
    name: Build and publish claude-run binary
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_PROVIDER: dev.a8n.run
      REGISTRY_OWNER: ${{ github.repository_owner }}
      REGISTRY_USER: ""
      REGISTRY_PASSWORD: ${{ secrets.FORGEJO_PAT }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      # CLAUDE-135 (GOV-13 / CLAUDE-122): a release commit is pushed to `main`
      # and tagged `v*` at the same commit, firing BOTH the branch-push and the
      # tag-push run of this workflow. The publish MODE is derived from the
      # TRIGGER, never from `git describe`: a tag ref -> release (publish
      # `vX.Y.Z` only), a main push -> latest (publish `latest` only), a manual
      # run -> dry-run. Resolving disjoint tags per trigger keeps the two runs
      # off the same immutable generic-package file, which is what caused the
      # 409 race. `git describe` is kept for build metadata only.
      - name: Resolve publish mode, train and tag
        id: resolve
        shell: nu {0}
        run: |
          let event = "${{ github.event_name }}"
          let ref_type = "${{ github.ref_type }}"
          let ref_name = "${{ github.ref_name }}"
          let simulate_tag = "${{ inputs.simulate_tag }}"
          let mode = if $event == "workflow_dispatch" {
            "dry-run"
          } else if $ref_type == "tag" {
            "release"
          } else {
            "latest"
          }
          # A manual run only mutates the registry if dry_run is explicitly
          # false; the input defaults to true, and push events always publish
          # for real.
          let dry_run = ($event == "workflow_dispatch" and "${{ inputs.dry_run }}" != "false")
          let r = (^nu oci-build/get-tags.nu --mode $mode --ref-name $ref_name --simulate-tag $simulate_tag --json | from json)
          $"mode=($r.mode)\n" | save --append $env.GITHUB_OUTPUT
          $"train=($r.train)\n" | save --append $env.GITHUB_OUTPUT
          $"tag=($r.tag)\n" | save --append $env.GITHUB_OUTPUT
          $"describe=($r.describe)\n" | save --append $env.GITHUB_OUTPUT
          $"dry_run=($dry_run)\n" | save --append $env.GITHUB_OUTPUT
          print $"mode=($r.mode) train=($r.train) tag=($r.tag) describe=($r.describe) dry_run=($dry_run)"

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Set environment variables
        shell: nu {0}
        run: |
          let owner = $env.REGISTRY_OWNER
          $"REGISTRY_USER=($owner)\n" | save --append $env.GITHUB_ENV

      - name: Compute build metadata
        id: build-meta
        shell: nu {0}
        run: |
          let git_hash = (^git rev-parse --short=12 HEAD | str trim)
          $"git_hash=($git_hash)\n" | save --append $env.GITHUB_OUTPUT
          print $"git_hash=($git_hash)"
          let build_date = (^date -u +%Y-%m-%d | str trim)
          $"build_date=($build_date)\n" | save --append $env.GITHUB_OUTPUT
          print $"build_date=($build_date)"

      - name: Build binary
        shell: nu {0}
        run: |
          let git_hash = "${{ steps.build-meta.outputs.git_hash }}"
          let build_date = "${{ steps.build-meta.outputs.build_date }}"
          let jobs = ((sys cpu | length) | into int)
          print $"CARGO_BUILD_JOBS=($jobs)"
          let build_args = [
              --build-arg $"GIT_SHA=($git_hash)"
              --build-arg $"BUILD_DATE=($build_date)"
              --build-arg $"CARGO_BUILD_JOBS=($jobs)"
          ]
          # --target binary exports the scratch stage that contains only the
          # compiled musl binary; this repo's Dockerfile has no runtime stage.
          ^docker buildx build --target binary --output type=local,dest=./output ...$build_args -f oci-build/Dockerfile .
          cp ./output/claude-run ./claude-run-linux-x86_64
          # CLAUDE-49: publish a sha256 sidecar so `version update` can verify
          # the download before swapping the running binary.
          ^sha256sum claude-run-linux-x86_64 | save --raw claude-run-linux-x86_64.sha256
          print (open --raw claude-run-linux-x86_64.sha256)

      - name: Publish binary as Generic Package
        shell: nu {0}
        run: |
          let train = "${{ steps.resolve.outputs.train }}"
          let tag = "${{ steps.resolve.outputs.tag }}"
          let dry_run = ("${{ steps.resolve.outputs.dry_run }}" == "true")
          let owner = $env.REGISTRY_USER
          let provider = $env.REGISTRY_PROVIDER
          let password = $env.REGISTRY_PASSWORD
          # CLAUDE-49: publish the binary and its sha256 sidecar to the same
          # generic-package path, so `version update` can verify the download
          # before swapping the running binary.
          let assets = [claude-run-linux-x86_64 claude-run-linux-x86_64.sha256]
          if $dry_run {
            print $"[dry-run] train=($train) - NO registry mutations will be performed"
          }
          for asset in $assets {
            let url = $"https://($provider)/api/packages/($owner)/generic/claude-run/($tag)/($asset)"
            if $train == "release" {
              # Write-once: a released artifact is immutable and only the
              # tag-push run ever publishes it, so no second run races this
              # path. Never pre-delete; probe and fail loudly if the version
              # artifact already exists rather than overwriting it.
              print $"Checking for an existing release artifact at ($url)"
              let probe = (
                http get --full --allow-errors --user $owner --password $password $url
                | get status
              )
              if $probe == 200 {
                print --stderr $"FAIL: release artifact already exists at ($url) \(HTTP 200\). Releases are immutable; refusing to overwrite."
                exit 1
              }
              if $probe != 404 {
                print --stderr $"Unexpected status probing ($url): ($probe)"
                exit 1
              }
              print "No existing artifact (HTTP 404) - safe to publish write-once"
              if $dry_run {
                print $"[dry-run] WOULD upload \(write-once\) ($asset) to ($url)"
              } else {
                print $"Publishing ($asset) to ($url)"
                ^curl --silent --show-error --fail-with-body --upload-file $"./($asset)" --user $"($owner):($password)" $url
              }
            } else {
              # latest train: the rolling tag is replaced on every main push, so
              # keep delete-then-reupload (overwrite). The release commit's
              # tag-push run targets `vX.Y.Z`, not `latest`, so the two runs no
              # longer collide on this path. Generic Packages files are
              # immutable, so DELETE first; 204 removed, 404 nothing there,
              # refuse to continue on any other status.
              if $dry_run {
                print $"[dry-run] WOULD DELETE existing ($url) \(ignoring 404\)"
                print $"[dry-run] WOULD upload ($asset) to ($url)"
              } else {
                print $"Deleting existing package at ($url) - ignoring 404"
                let delete_status = (
                  http delete --full --allow-errors --user $owner --password $password $url
                  | get status
                )
                if $delete_status not-in [204 404] {
                  print --stderr $"Unexpected DELETE status: ($delete_status)"
                  exit 1
                }
                print $"DELETE returned ($delete_status)"
                print $"Publishing ($asset) to ($url)"
                ^curl --silent --show-error --fail-with-body --upload-file $"./($asset)" --user $"($owner):($password)" $url
              }
            }
          }

      - name: Print published URLs
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          let dry_run = ("${{ steps.resolve.outputs.dry_run }}" == "true")
          let prefix = if $dry_run { "[dry-run] WOULD publish generic package:" } else { "Generic package:" }
          print $"($prefix) https://($env.REGISTRY_PROVIDER)/api/packages/($env.REGISTRY_USER)/generic/claude-run/($tag)/claude-run-linux-x86_64"
