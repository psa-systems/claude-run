---

# CLAUDE-94: publish the runtime image (CLAUDE-37 `runtime` target: daemon +
# pinned nu/claude/yt/fj toolchain) to the Forgejo OCI registry as
# `dev.a8n.run/<owner>/claude-run:<tag>` on every push to main / tag, with the
# trigger-derived tag the binary uses (vX.Y.Z on tags, moving `latest` on
# main). The image compiles from source via the multi-stage Dockerfile; it is
# independent of the binary publish (`.forgejo/workflows/build-binary.yml`), so
# a failure in one never fails the other.
name: Build image

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "src/**"
      - "migrations/**"
      - "templates/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "oci-build/**"
      - "deploy/**"
      - ".forgejo/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, compute tags and print every registry action without pushing"
        type: boolean
        default: true
      simulate_tag:
        description: "Version like v9.9.9 to exercise the release publish path; empty exercises latest"
        type: string
        default: ""

jobs:
  build-and-push:
    name: Build and push claude-run runtime image
    # HEAVY: runs `docker buildx build`, a full cargo compile of the runtime image (DEV-769).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_HEAVY }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_PROVIDER: dev.a8n.run
      REGISTRY_OWNER: ${{ github.repository_owner }}
      REGISTRY_USER: ""
      REGISTRY_PASSWORD: ${{ secrets.FORGEJO_PAT }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Take build parallelism from the runner
        # Exports CARGO_BUILD_JOBS / NEXTEST_TEST_THREADS / CI_JOBS; warns and
        # falls back to a low CPU-derived value when the runner did not set them (DEV-769).
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/build-parallelism@main

      - name: Start job metrics sampler
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-start@main

      # CLAUDE-135 (GOV-13 / CLAUDE-122): a release commit is pushed to `main`
      # and tagged `v*` at the same commit, firing BOTH the branch-push and the
      # tag-push run of this workflow. OCI tags are mutable so the push does not
      # 409, but the same commit still double-builds and both runs raced to
      # overwrite `latest`. The publish MODE is derived from the TRIGGER, never
      # from `git describe`: a tag ref -> release (push `vX.Y.Z` only), a main
      # push -> latest (push `latest` only), a manual run -> dry-run. Resolving
      # disjoint tags per trigger keeps the two runs off the same destination.
      - name: Resolve publish mode, train and tag
        id: resolve
        shell: nu {0}
        run: |
          let event = "${{ github.event_name }}"
          let ref_type = "${{ github.ref_type }}"
          let ref_name = "${{ github.ref_name }}"
          let simulate_tag = "${{ inputs.simulate_tag }}"
          let mode = if $event == "workflow_dispatch" {
            "dry-run"
          } else if $ref_type == "tag" {
            "release"
          } else {
            "latest"
          }
          # A manual run only mutates the registry if dry_run is explicitly
          # false; the input defaults to true, and push events always publish
          # for real.
          let dry_run = ($event == "workflow_dispatch" and "${{ inputs.dry_run }}" != "false")
          let r = (^nu oci-build/get-tags.nu --mode $mode --ref-name $ref_name --simulate-tag $simulate_tag --json | from json)
          $"mode=($r.mode)\n" | save --append $env.GITHUB_OUTPUT
          $"train=($r.train)\n" | save --append $env.GITHUB_OUTPUT
          $"tag=($r.tag)\n" | save --append $env.GITHUB_OUTPUT
          $"describe=($r.describe)\n" | save --append $env.GITHUB_OUTPUT
          $"dry_run=($dry_run)\n" | save --append $env.GITHUB_OUTPUT
          print $"mode=($r.mode) train=($r.train) tag=($r.tag) describe=($r.describe) dry_run=($dry_run)"

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Set environment variables
        shell: nu {0}
        run: |
          let owner = $env.REGISTRY_OWNER
          $"REGISTRY_USER=($owner)\n" | save --append $env.GITHUB_ENV

      - name: Compute build metadata
        id: build-meta
        shell: nu {0}
        run: |
          let git_hash = (^git rev-parse --short=12 HEAD | str trim)
          $"git_hash=($git_hash)\n" | save --append $env.GITHUB_OUTPUT
          print $"git_hash=($git_hash)"
          let build_date = (^date -u +%Y-%m-%d | str trim)
          $"build_date=($build_date)\n" | save --append $env.GITHUB_OUTPUT
          print $"build_date=($build_date)"

      # OCI image names must be lowercase, so the owner segment is downcased. A
      # dry-run still logs in (no registry mutation) so the build can resolve
      # private base layers if any.
      - name: Log in to the OCI registry
        shell: nu {0}
        run: |
          $env.REGISTRY_PASSWORD | ^docker login $env.REGISTRY_PROVIDER --username $env.REGISTRY_USER --password-stdin

      - name: Build and push runtime image
        shell: nu {0}
        run: |
          let git_hash = "${{ steps.build-meta.outputs.git_hash }}"
          let build_date = "${{ steps.build-meta.outputs.build_date }}"
          let tag = "${{ steps.resolve.outputs.tag }}"
          let dry_run = ("${{ steps.resolve.outputs.dry_run }}" == "true")
          # The runner owns build parallelism; build-parallelism exported it above.
          let jobs = $env.CARGO_BUILD_JOBS
          print $"CARGO_BUILD_JOBS=($jobs)"
          # Single trigger-derived tag: `latest` on a main push, `vX.Y.Z` on a
          # tag push. The two runs of a release commit push DISJOINT tags, so
          # they never race to overwrite the same destination.
          let image = $"($env.REGISTRY_PROVIDER)/($env.REGISTRY_USER | str downcase)/claude-run"
          let tag_args = [--tag $"($image):($tag)"]
          let build_args = [
              --build-arg $"GIT_SHA=($git_hash)"
              --build-arg $"BUILD_DATE=($build_date)"
              --build-arg $"CARGO_BUILD_JOBS=($jobs)"
          ]
          # A dry-run builds (loading the image locally) but never pushes the
          # tag, so it mutates nothing. The runner's Docker layer cache keeps
          # the builder-stage compile cheap on repeat builds; --target runtime
          # assembles the runtime stage.
          let push_args = if $dry_run { [--load] } else { [--push] }
          if $dry_run {
            print $"[dry-run] WOULD build and push ($image):($tag) - building locally without pushing"
          } else {
            print $"Building and pushing ($image):($tag)"
          }
          ^docker buildx build --target runtime ...$push_args ...$tag_args ...$build_args -f oci-build/Dockerfile .

      - name: Print published image references
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          let dry_run = ("${{ steps.resolve.outputs.dry_run }}" == "true")
          let image = $"($env.REGISTRY_PROVIDER)/($env.REGISTRY_USER | str downcase)/claude-run"
          if $dry_run {
            print $"[dry-run] WOULD push runtime image: ($image):($tag)"
          } else {
            print $"Runtime image: ($image):($tag)"
            ^docker buildx imagetools inspect $"($image):($tag)"
          }

      - name: Report job metrics
        # Last and always(), so a failing job still reports (composite actions have no post hook).
        if: always()
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-report@main
