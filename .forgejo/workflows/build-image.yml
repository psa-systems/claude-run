---

# CLAUDE-94: publish the runtime image (CLAUDE-37 `runtime` target: daemon +
# pinned nu/claude/yt/fj toolchain) to the Forgejo OCI registry as
# `dev.a8n.run/<owner>/claude-run:<tag>` on every push to main / tag, with the
# same tag set as the binary's Generic Package (vX.Y.Z on tags, moving `latest`
# on main). The image compiles from source via the multi-stage Dockerfile; it
# is independent of the binary publish (`.forgejo/workflows/build-binary.yml`),
# so a failure in one never fails the other.
name: Build image

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "src/**"
      - "migrations/**"
      - "templates/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "oci-build/**"
      - "deploy/**"
      - ".forgejo/workflows/build-image.yml"

jobs:
  build-and-push:
    name: Build and push claude-run runtime image
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_PROVIDER: dev.a8n.run
      REGISTRY_OWNER: ${{ github.repository_owner }}
      REGISTRY_USER: ""
      REGISTRY_PASSWORD: ${{ secrets.FORGEJO_PAT }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      # CLAUDE-122: a release commit is pushed to `main` and tagged `v*` at the
      # same commit, firing both the branch-push and the tag-push run of this
      # workflow. OCI tags are mutable so the push will not 409, but the same
      # commit still double-builds and both runs race to overwrite `latest`.
      # Suppress the redundant branch-push run when HEAD is also an exact tag,
      # leaving the tag-push run as the sole publisher. `git describe
      # --exact-match` needs the tags, which the `fetch-depth: 0` checkout above
      # provides.
      - name: Decide whether to publish
        id: guard
        shell: nu {0}
        run: |
          let ref_type = "${{ github.ref_type }}"
          let ref = "${{ github.ref }}"
          # Prefer github.ref_type; fall back to the refs/heads/ prefix if the
          # runner does not populate ref_type.
          let is_branch = ($ref_type == "branch") or ($ref | str starts-with "refs/heads/")
          let is_tagged = ((^git describe --tags --exact-match HEAD | complete | get exit_code) == 0)
          let skip = ($is_branch and $is_tagged)
          $"skip=($skip)\n" | save --append $env.GITHUB_OUTPUT
          if $skip {
            print "HEAD is a tagged release commit pushed to a branch; the tag-push run is the sole publisher. Skipping build + push."
          } else {
            print $"Proceeding: is_branch=($is_branch) is_tagged=($is_tagged)"
          }

      - name: Verify Docker availability
        if: steps.guard.outputs.skip != 'true'
        run: |
          docker version
          docker buildx version

      - name: Set environment variables
        if: steps.guard.outputs.skip != 'true'
        shell: nu {0}
        run: |
          let owner = $env.REGISTRY_OWNER
          $"REGISTRY_USER=($owner)\n" | save --append $env.GITHUB_ENV

      - name: Get artifact tags
        id: get-tags
        if: steps.guard.outputs.skip != 'true'
        shell: nu {0}
        run: |
          let tags = (^nu oci-build/get-tags.nu --joined)
          $"tags=($tags)\n" | save --append $env.GITHUB_OUTPUT

      - name: Compute build metadata
        id: build-meta
        if: steps.guard.outputs.skip != 'true'
        shell: nu {0}
        run: |
          let git_hash = (^git rev-parse --short=12 HEAD | str trim)
          $"git_hash=($git_hash)\n" | save --append $env.GITHUB_OUTPUT
          print $"git_hash=($git_hash)"
          let build_date = (^date -u +%Y-%m-%d | str trim)
          $"build_date=($build_date)\n" | save --append $env.GITHUB_OUTPUT
          print $"build_date=($build_date)"

      # OCI image names must be lowercase, so the owner segment is downcased.
      - name: Log in to the OCI registry
        if: steps.guard.outputs.skip != 'true'
        shell: nu {0}
        run: |
          $env.REGISTRY_PASSWORD | ^docker login $env.REGISTRY_PROVIDER --username $env.REGISTRY_USER --password-stdin

      - name: Build and push runtime image
        if: steps.guard.outputs.skip != 'true'
        shell: nu {0}
        run: |
          let git_hash = "${{ steps.build-meta.outputs.git_hash }}"
          let build_date = "${{ steps.build-meta.outputs.build_date }}"
          let jobs = ((sys cpu | length) | into int)
          print $"CARGO_BUILD_JOBS=($jobs)"
          let tags_str = "${{ steps.get-tags.outputs.tags }}"
          let tags = ($tags_str | split row ",")
          let image = $"($env.REGISTRY_PROVIDER)/($env.REGISTRY_USER | str downcase)/claude-run"
          let tag_args = ($tags | each { |tag| [--tag $"($image):($tag)"] } | flatten)
          let build_args = [
              --build-arg $"GIT_SHA=($git_hash)"
              --build-arg $"BUILD_DATE=($build_date)"
              --build-arg $"CARGO_BUILD_JOBS=($jobs)"
          ]
          # The runner's Docker layer cache keeps the builder-stage compile cheap
          # on repeat builds; --target runtime assembles the runtime stage and
          # pushes it for every tag.
          ^docker buildx build --target runtime --push ...$tag_args ...$build_args -f oci-build/Dockerfile .

      - name: Print published image references
        if: steps.guard.outputs.skip != 'true'
        shell: nu {0}
        run: |
          let tags_str = "${{ steps.get-tags.outputs.tags }}"
          let tags = ($tags_str | split row ",")
          let image = $"($env.REGISTRY_PROVIDER)/($env.REGISTRY_USER | str downcase)/claude-run"
          for tag in $tags {
            print $"Runtime image: ($image):($tag)"
            ^docker buildx imagetools inspect $"($image):($tag)"
          }
