<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>claude-run: set up two-factor authentication</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --panel-2: #1f232b;
      --border: #2a2f3a;
      --fg: #d8dde7;
      --fg-dim: #8b93a3;
      --accent: #7ab7ff;
      --bad: #e07070;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; font-size: 14px; }
    .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 28px; width: 100%; max-width: 420px; }
    h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
    .sub { color: var(--fg-dim); font-size: 12px; margin: 0 0 20px; }
    label { display: block; color: var(--fg-dim); font-size: 12px; margin: 14px 0 4px; }
    input { width: 100%; background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 9px 10px; font-size: 14px; letter-spacing: 2px; }
    input:focus { outline: none; border-color: var(--accent); }
    button { width: 100%; margin-top: 20px; background: var(--accent); color: #0a0c10; border: none; border-radius: 4px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    .err { background: rgba(224, 112, 112, 0.12); color: var(--bad); border: 1px solid rgba(224, 112, 112, 0.3); border-radius: 4px; padding: 8px 10px; font-size: 13px; margin-bottom: 8px; }
    .qr { background: #fff; border-radius: 6px; padding: 12px; margin: 12px 0; display: flex; justify-content: center; }
    .qr svg { width: 200px; height: 200px; }
    .url { word-break: break-all; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; font-size: 12px; color: var(--fg-dim); margin: 8px 0 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Set up two-factor authentication</h1>
      <p class="sub">Every claude-run account requires TOTP. Scan the code below with an authenticator app, then confirm with a current code.</p>
      {% if let Some(e) = error %}<div class="err">{{ e }}</div>{% endif %}
      <div class="qr">{{ qr_svg|safe }}</div>
      <p class="sub">Can't scan? Enter this manually:</p>
      <div class="url">{{ otpauth_url }}</div>
      <form method="post" action="/account/2fa/setup">
        <label for="code">Confirmation code</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" autofocus required>
        <button type="submit">Confirm and enable</button>
      </form>
    </div>
  </div>
</body>
</html>
