<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}claude-run{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --panel-2: #1f232b;
      --border: #2a2f3a;
      --fg: #d8dde7;
      --fg-dim: #8b93a3;
      --accent: #7ab7ff;
      --ok: #5fc97e;
      --warn: #e0b75a;
      --bad: #e07070;
      --pause: #b48ff0;
      --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; font-size: 14px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: baseline; gap: 24px; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    header nav a { color: var(--fg-dim); margin-right: 16px; }
    header nav a:hover { color: var(--fg); }
    main { padding: 24px; max-width: 1280px; margin: 0 auto; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-dim); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin: 32px 0 16px; }
    h2:first-child { margin-top: 0; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
    .card h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
    .card .meta { color: var(--fg-dim); font-size: 12px; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-family: var(--mono); }
    .badge.ok { background: rgba(95, 201, 126, 0.15); color: var(--ok); }
    .badge.warn { background: rgba(224, 183, 90, 0.15); color: var(--warn); }
    .badge.bad { background: rgba(224, 112, 112, 0.15); color: var(--bad); }
    .badge.pause { background: rgba(180, 143, 240, 0.15); color: var(--pause); }
    .badge.neutral { background: rgba(139, 147, 163, 0.15); color: var(--fg-dim); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--fg-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    td.mono { font-family: var(--mono); }
    td.dim { color: var(--fg-dim); }
    .btn { display: inline-block; background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .btn:hover { background: #252a34; }
    .btn[disabled] { opacity: 0.4; cursor: not-allowed; }
    .row-actions { display: flex; gap: 8px; }
    pre.stream { background: #0a0c10; border: 1px solid var(--border); border-radius: 4px; padding: 12px; max-height: 600px; overflow: auto; font-family: var(--mono); font-size: 12px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
    pre.stream .ev-system { color: var(--fg-dim); }
    pre.stream .ev-assistant { color: var(--accent); }
    pre.stream .ev-user { color: var(--ok); }
    pre.stream .ev-result-ok { color: var(--ok); font-weight: bold; }
    pre.stream .ev-result-err { color: var(--bad); font-weight: bold; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; }
    .kv dt { color: var(--fg-dim); }
    .kv dd { margin: 0; font-family: var(--mono); font-size: 13px; }
    footer { color: var(--fg-dim); font-size: 11px; padding: 24px; text-align: center; }
  </style>
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <h1><a href="/" style="color: var(--fg);">claude-run</a></h1>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/api/status">API</a>
    </nav>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
  <footer>
    claude-run v{{ version }} - <a href="https://dev.a8n.run/psa-systems/claude-bot">source</a>
  </footer>
</body>
</html>
