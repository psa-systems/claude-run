<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}claude-run{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --panel-2: #1f232b;
      --border: #2a2f3a;
      --fg: #d8dde7;
      --fg-dim: #8b93a3;
      --accent: #7ab7ff;
      --ok: #5fc97e;
      --warn: #e0b75a;
      --bad: #e07070;
      --pause: #b48ff0;
      --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; font-size: 14px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: baseline; gap: 24px; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    header nav a { color: var(--fg-dim); margin-right: 16px; }
    header nav a:hover { color: var(--fg); }
    main { padding: 24px; max-width: 1280px; margin: 0 auto; }
    .breadcrumb { font-size: 12px; margin: 0 0 20px; }
    .breadcrumb a { color: var(--fg-dim); }
    .breadcrumb a:hover { color: var(--fg); }
    .breadcrumb .sep { margin: 0 8px; color: var(--fg-dim); }
    .breadcrumb .current { color: var(--fg); }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-dim); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin: 32px 0 16px; }
    h2:first-child { margin-top: 0; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
    .card h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
    .card .meta { color: var(--fg-dim); font-size: 12px; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-family: var(--mono); }
    .badge.ok { background: rgba(95, 201, 126, 0.15); color: var(--ok); }
    .badge.warn { background: rgba(224, 183, 90, 0.15); color: var(--warn); }
    .badge.bad { background: rgba(224, 112, 112, 0.15); color: var(--bad); }
    .badge.pause { background: rgba(180, 143, 240, 0.15); color: var(--pause); }
    .badge.neutral { background: rgba(139, 147, 163, 0.15); color: var(--fg-dim); }
    .badge.cancel { background: rgba(180, 143, 240, 0.15); color: var(--pause); border: 1px dashed var(--pause); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--fg-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    /* CLAUDE-140: clickable sort headers + per-column filter dropdowns on the run-detail tables. */
    a.sort-link { color: inherit; text-decoration: none; cursor: pointer; white-space: nowrap; }
    a.sort-link:hover { color: var(--fg); }
    th select { display: block; margin-top: 4px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; font-size: 11px; padding: 2px 4px; text-transform: none; letter-spacing: 0; font-weight: normal; }
    td.mono { font-family: var(--mono); }
    td.dim { color: var(--fg-dim); }
    .btn { display: inline-block; background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .btn:hover { background: #252a34; }
    .btn[disabled] { opacity: 0.4; cursor: not-allowed; }
    .row-actions { display: flex; gap: 8px; }
    .stream { background: #0a0c10; border: 1px solid var(--border); border-radius: 4px; padding: 12px; max-height: 600px; overflow: auto; font-family: var(--mono); font-size: 12px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
    .stream .ev { display: block; padding: 2px 0; }
    .stream .ev-ts { color: var(--fg-dim); font-weight: normal; }
    .stream .ev-system { color: var(--fg-dim); }
    .stream .ev-assistant { color: var(--accent); }
    .stream .ev-user { color: var(--ok); }
    .stream .ev-tool { color: var(--warn); }
    .stream .ev-result-ok { color: var(--ok); font-weight: bold; }
    .stream .ev-result-err { color: var(--bad); font-weight: bold; }
    .activity { font-family: var(--mono); }
    .activity.stale { color: var(--bad); font-weight: bold; }
    .activity.live { color: var(--ok); }
    /* CLAUDE-89: run-detail summary column clamp + view-details dialog. */
    td.summary-cell { max-width: 360px; }
    .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    dialog.summary-dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 16px; max-width: 720px; width: 90vw; max-height: 80vh; overflow: auto; }
    dialog.summary-dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
    .summary-dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 12px; }
    .md-body { font-size: 13px; line-height: 1.5; text-align: left; }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4 { font-size: 14px; text-transform: none; letter-spacing: normal; border-bottom: none; color: var(--fg); margin: 16px 0 8px; padding-bottom: 0; }
    .md-body p { margin: 8px 0; }
    .md-body ul, .md-body ol { margin: 8px 0; padding-left: 20px; }
    .md-body code { font-family: var(--mono); font-size: 12px; background: var(--panel-2); padding: 1px 4px; border-radius: 3px; }
    .md-body pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 8px; overflow: auto; }
    .md-body pre code { background: none; padding: 0; }
    .md-body blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding-left: 12px; color: var(--fg-dim); }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; }
    .kv dt { color: var(--fg-dim); }
    .kv dd { margin: 0; font-family: var(--mono); font-size: 13px; }
    footer { color: var(--fg-dim); font-size: 11px; padding: 24px; text-align: center; }
  </style>
  <script src="/static/htmx.min.js"></script>
  <!-- CLAUDE-139: idiomorph htmx extension; registers the `morph` swap so the
       live poll patches the DOM in place instead of replacing it. -->
  <script src="/static/idiomorph-ext.min.js"></script>
</head>
<!-- CLAUDE-139: enable the idiomorph `morph` swap extension for all descendants
     (poll regions opt in per-element via hx-swap="morph:..."). -->
<body hx-ext="morph">
  <header>
    <h1><a href="/" style="color: var(--fg);">claude-run</a></h1>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/reports">Reports</a>
      <a href="/secrets">Secrets</a>
      <a href="/access">Access</a>
      <a href="/settings">Settings</a>
      <a href="/about">About</a>
      <a href="/api/status">API</a>
    </nav>
  </header>
  <main>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      {% block breadcrumb %}{% endblock %}
    </nav>
    {% block main %}{% endblock %}
  </main>
  <footer>
    claude-run v{{ version }} - <a href="https://dev.a8n.run/psa-systems/claude-run">source</a>
  </footer>
</body>
</html>
