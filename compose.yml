# claude-run daemon, containerized (CLAUDE-37, CLAUDE-247).
#
# The whole daemon runs in this container, so every `claude` child it spawns
# inherits the container's clean $HOME and loads only the slim bot CLAUDE.md
# baked into the image (deploy/bot-CLAUDE.md), never the operator's interactive
# ~/.claude/CLAUDE.md.
#
# CLAUDE-247: the container is self-contained. It bind-mounts NOTHING from the
# host and reads no host credential. The operator logs Claude, YouTrack, Forgejo
# and git in INSIDE the container once (see README "Containerized deployment"),
# and each login persists on its own named volume. That keeps the runner's
# identity separate from the operator's and lets the stack deploy on a host
# where neither $HOME nor the invocation directory is available.
#
# Names are app-prefixed per house convention. For a development stack, prefix
# each name with `dev-` (service dev-claude-bot, network dev-claude-bot-private,
# volumes dev-claude-bot-*).

name: claude-bot

services:
  claude-bot:
    container_name: claude-bot
    # CLAUDE-88: published by .forgejo/workflows/build-image.yml on every main
    # push (`latest`) and release tag (`vX.Y.Z`). Pin a version tag in
    # production. For local development, comment `image:` and uncomment
    # the build block to build from the working tree instead.
    image: dev.a8n.run/psa-systems/claude-run:latest
    # build:
    #   context: .
    #   dockerfile: oci-build/Dockerfile
    #   target: runtime
    restart: unless-stopped
    networks:
      claude-bot-private:
    # CLAUDE-247: no `user:` here. The image starts as root so its entrypoint can
    # chown the volumes, then drops to claudebot with su-exec (pattern 3 in
    # governance/CONTAINER_UID_GID.md). A `user:` override would leave the
    # entrypoint without the privileges the chown needs.
    environment:
      CLAUDE_RUN_CONFIG_DIR: /home/claudebot/.config/claude-run
      CLAUDE_RUN_DATA_DIR: /home/claudebot/.local/share/claude-run
      CLAUDE_RUN_STATE_DIR: /home/claudebot/.local/state/claude-run
      CLAUDE_RUN_RUNTIME_DIR: /home/claudebot/.runtime/claude-run
      # CLAUDE-88: the env var carries the PATH to the secrets-store age key;
      # the key material itself travels as a compose secret (file mount), never
      # as an environment value (`docker inspect` / /proc leak surface).
      CLAUDE_RUN_SECRETS_KEY_FILE: /run/secrets/claude-run-age-key
    secrets:
      - claude-run-age-key
    volumes:
      # Runner state, backed by named volumes.
      - type: volume
        source: claude-bot-config
        target: /home/claudebot/.config/claude-run
      - type: volume
        source: claude-bot-data
        target: /home/claudebot/.local/share/claude-run
      - type: volume
        source: claude-bot-state
        target: /home/claudebot/.local/state/claude-run
      # Tool credentials, one volume per store, each written by an in-container
      # login. Separate volumes rather than subpaths of one: a `volume.subpath`
      # is resolved before the entrypoint runs, is never auto-created, and is
      # not seeded from the image, so a missing subdirectory fails the container
      # create outright.
      #
      # claude: `claude auth login` writes .credentials.json here. The image
      # bakes the slim bot CLAUDE.md at this path and Docker seeds it into the
      # empty volume on first start.
      - type: volume
        source: claude-bot-claude
        target: /home/claudebot/.claude
      # yt: the youtrack-cli instance store (config.yml, config-<name>.yml).
      - type: volume
        source: claude-bot-youtrack-cli
        target: /home/claudebot/.config/youtrack-cli
      # fj: forgejo-cli keys.json. The runner resolves this path itself through
      # the XDG data dir (src/provider/cli.rs), so it must stay where fj puts it.
      - type: volume
        source: claude-bot-forgejo-cli
        target: /home/claudebot/.local/share/forgejo-cli
      # git identity, at the path GIT_CONFIG_GLOBAL names in the image.
      - type: volume
        source: claude-bot-git
        target: /home/claudebot/.config/git
    # Runtime dir (pidfile, and the unix socket when it is enabled at all; the
    # image runs `serve --no-socket`). Ephemeral per container so nothing stale
    # survives a restart.
    tmpfs:
      - /home/claudebot/.runtime/claude-run

networks:
  claude-bot-private:
    name: claude-bot-private

volumes:
  claude-bot-config:
    name: claude-bot-config
  claude-bot-data:
    name: claude-bot-data
  claude-bot-state:
    name: claude-bot-state
  claude-bot-claude:
    name: claude-bot-claude
  claude-bot-youtrack-cli:
    name: claude-bot-youtrack-cli
  claude-bot-forgejo-cli:
    name: claude-bot-forgejo-cli
  claude-bot-git:
    name: claude-bot-git

# CLAUDE-88: the age identity that decrypts the secrets store (web auth token,
# webhook HMACs, registry token refs). Create it once before `compose up`:
#   mkdir secrets; chmod 700 secrets
#   age-keygen | save secrets/age-key.txt
# A deployment that cannot use a path relative to this file supplies the same
# secret from an environment value instead; see README "Containerized
# deployment".
secrets:
  claude-run-age-key:
    file: ./secrets/age-key.txt
