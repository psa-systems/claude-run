# claude-run daemon, containerized (CLAUDE-37, CLAUDE-247).
#
# The whole daemon runs in this container, so every `claude` child it spawns
# inherits the container's clean $HOME and loads only the slim bot CLAUDE.md
# baked into the image (deploy/bot-CLAUDE.md), never the operator's interactive
# ~/.claude/CLAUDE.md.
#
# CLAUDE-247: the container is self-contained. It bind-mounts NOTHING from the
# host and reads no host credential. The operator creates the web administrator
# at /setup and logs Claude, YouTrack, Forgejo and git in from the Settings ->
# Auth page (see README "Containerized deployment"). That keeps the runner's
# identity separate from the operator's and lets the stack deploy on a host
# where neither $HOME nor the invocation directory is available.
#
# CLAUDE-253: three flat volumes, /config /data /state. Nothing persists under
# $HOME, and no path here needs to know about XDG.
#
# Names are app-prefixed per house convention. For a development stack, prefix
# each name with `dev-` (service dev-claude-bot, network dev-claude-bot-private,
# volumes dev-claude-bot-*).

name: claude-bot

services:
  claude-bot:
    container_name: claude-bot
    # CLAUDE-88: published by .forgejo/workflows/build-image.yml on every main
    # push (`latest`) and release tag (`vX.Y.Z`). Pin a version tag in
    # production. For local development, comment `image:` and uncomment
    # the build block to build from the working tree instead.
    image: dev.a8n.run/psa-systems/claude-run:latest
    # build:
    #   context: .
    #   dockerfile: oci-build/Dockerfile
    #   target: runtime
    restart: unless-stopped
    networks:
      claude-bot-private:
    # CLAUDE-247: no `user:` here. The image starts as root so its entrypoint can
    # chown the volumes, then drops to claudebot with su-exec (pattern 3 in
    # governance/CONTAINER_UID_GID.md). A `user:` override would leave the
    # entrypoint without the privileges the chown needs.
    environment:
      # CLAUDE-253: the image already sets every path (three flat roots plus the
      # tool stores under them), so nothing here has to restate them. Override
      # one only to move a store somewhere unusual.
      #
      # CLAUDE-249: the secrets key lives at /config/secrets.key, generated on
      # first start. Set CLAUDE_RUN_SECRETS_KEY_FILE only to supply your own,
      # e.g. from a secret store; the value is a PATH, never key material.
      CLAUDE_RUN_LOG: info
      # CLAUDE-250: uncomment together with the `claude-run-database-url` secret
      # below to put the runner state on the `postgres` profile's server instead
      # of the SQLite file on claude-bot-data. Unset means SQLite, which is what
      # this file does by default. The URL travels as a file, not as an
      # environment value, because it carries the password.
      # CLAUDE_RUN_DATABASE_URL_FILE: /run/secrets/claude-run-database-url
    # CLAUDE-250: uncomment with the variable above; the daemon reads the URL
    # from the file this mounts.
    # secrets:
    #   - claude-run-database-url
    # CLAUDE-250: `required: false` so this stays a no-op without
    # `--profile postgres`: the plain stack is SQLite-only and must not wait on
    # a service that was never started.
    depends_on:
      claude-bot-postgres:
        condition: service_healthy
        required: false
    volumes:
      # CLAUDE-253: three mounts, not seven. Each tool's store is a
      # subdirectory of one of these rather than a mount point of its own,
      # because the image points every tool at them by environment variable.
      #
      # config.toml, actions/, secrets.key, claude-agent-home/ (the agent's
      # Claude login), youtrack-cli/ (yt), git/ (the commit identity).
      - type: volume
        source: claude-bot-config
        target: /config
      # state.db (runs, outcomes, the encrypted secrets store), per-job
      # workdirs, and forgejo-cli/ (fj's key store, which fj reads from the XDG
      # data dir; claude-run resolves it the same way).
      - type: volume
        source: claude-bot-data
        target: /data
      # Logs and per-attempt stream JSONL. Separate from /data because it is the
      # volume you would drop: different retention, different growth, no
      # irreplaceable state.
      - type: volume
        source: claude-bot-state
        target: /state
    # Runtime dir (the pidfile; the image runs `serve --no-socket`, so there is
    # no socket). Ephemeral per container so nothing stale survives a restart.
    tmpfs:
      - /run/claude-run

  # CLAUDE-250: the optional PostgreSQL state store. Behind a profile, so a plain
  # `docker compose up` starts exactly the service set it started before this
  # existed; `docker compose --profile postgres up` adds the database. Nothing
  # is carried over from an existing state.db (that is CLAUDE-251), so the first
  # start on this backend is a fresh instance.
  claude-bot-postgres:
    container_name: claude-bot-postgres
    image: docker.io/postgres:18.4-alpine3.23
    profiles:
      - postgres
    restart: unless-stopped
    networks:
      claude-bot-private:
    environment:
      POSTGRES_DB: claude_run
      POSTGRES_USER: claude_run
      # A file mount rather than POSTGRES_PASSWORD, which `docker inspect` and
      # /proc/<pid>/environ would expose.
      POSTGRES_PASSWORD_FILE: /run/secrets/claude-run-postgres-password
    secrets:
      - claude-run-postgres-password
    volumes:
      - type: volume
        source: claude-bot-postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=claude_run --dbname=claude_run"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  claude-bot-private:
    name: claude-bot-private

volumes:
  claude-bot-config:
    name: claude-bot-config
  claude-bot-data:
    name: claude-bot-data
  claude-bot-state:
    name: claude-bot-state
  # CLAUDE-250: only mounted by the profiled claude-bot-postgres service.
  claude-bot-postgres:
    name: claude-bot-postgres

# CLAUDE-250: the two files the `postgres` profile needs. Create them before
# `docker compose --profile postgres up`:
#   mkdir secrets; chmod 700 secrets
#   openssl rand -base64 32 | save secrets/postgres-password.txt
#   $"postgres://claude_run:($password)@claude-bot-postgres:5432/claude_run" | save secrets/database-url.txt
# The daemon reads the URL only when CLAUDE_RUN_DATABASE_URL_FILE above is
# uncommented; without it the stack stays on SQLite even with the profile on.
secrets:
  claude-run-postgres-password:
    file: ./secrets/postgres-password.txt
  claude-run-database-url:
    file: ./secrets/database-url.txt
