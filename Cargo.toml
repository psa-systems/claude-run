[package]
name = "claude-run"
version = "0.27.0"
edition = "2021"
description = "YAML-driven runner that feeds tracker issues, CI failures and PR comments to Claude Code."
license = "MIT"
repository = "https://dev.a8n.run/psa-systems/claude-run"

[[bin]]
name = "claude-run"
path = "src/bin/claude-run.rs"

[lib]
name = "claude_run"
path = "src/lib.rs"

[dependencies]
age = "0.11"
anstream = "1"
anstyle = "1"
anyhow = "1"
askama = "0.12"
async-stream = "0.3"
cron = "0.12"
daemonize = "0.5"
dirs = "5"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
humantime = "2"
http-body-util = "0.1"
hyperlocal = "0.9"
libc = "0.2"
rpassword = "7"
semver = "1"
serde_json = "1"
serde_urlencoded = "0.7"
serde_yaml = "0.9"
sha2 = "0.10"
shellexpand = "3"
thiserror = "1"
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.8"
tower = "0.5"
tracing = "0.1"
getrandom = "0.2"
argon2 = "0.6.0"
qrcodegen = "1.8.0"

[dependencies.totp-rs]
version = "6.0.0"
default-features = false
features = [
    "std",
    "gen_secret",
    "otpauth",
]

[dependencies.pulldown-cmark]
version = "0.13.4"
default-features = false
features = ["html"]

[dependencies.axum]
version = "0.7"
features = ["macros"]

[dependencies.chrono]
version = "0.4"
features = [
    "serde",
    "unstable-locales",
]

[dependencies.chrono-tz]
version = "0.10"
features = ["serde"]

[dependencies.clap]
version = "4"
features = [
    "derive",
    "env",
]

[dependencies.hyper]
version = "1"
features = [
    "client",
    "http1",
]

[dependencies.hyper-util]
version = "0.1"
features = [
    "client",
    "client-legacy",
    "tokio",
    "http1",
]

[dependencies.url]
version = "2"

[dependencies.lettre]
version = "0.11"
default-features = false
features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.sqlx]
version = "0.8"
features = [
    "runtime-tokio",
    "any",
    "sqlite",
    "postgres",
    "tls-rustls-ring-webpki",
    "macros",
    "chrono",
    "migrate",
]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = [
    "blocking",
    "rustls-tls",
    "json",
]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.tower-http]
version = "0.6"
features = ["trace"]

[dependencies.tracing-subscriber]
version = "0.3"
features = [
    "env-filter",
    "json",
]

[dev-dependencies]
tempfile = "3"
