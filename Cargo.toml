[package]
name = "claude-run"
version = "0.1.0"
edition = "2021"
description = "YAML-driven Claude Code runner. Rust port of scripts/claude-run.nu."
license = "MIT"
repository = "https://dev.a8n.run/psa-systems/claude-bot"

[[bin]]
name = "claude-run"
path = "src/bin/claude-run.rs"

[lib]
name = "claude_run"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shellexpand = "3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
