[package]
name = "claude-run"
version = "0.38.1"
edition = "2021"
description = "YAML-driven runner that feeds tracker issues, CI failures and PR comments to Claude Code."
license = "MIT"
repository = "https://dev.a8n.run/psa-systems/claude-run"

[[bin]]
name = "claude-run"
path = "src/bin/claude-run.rs"

[lib]
name = "claude_run"
path = "src/lib.rs"

[dependencies]
age = "0.12.1"
anstream = "1"
anstyle = "1.0.14"
anyhow = "1.0.104"
askama = "0.16.1"
async-stream = "0.3.6"
async-trait = "0.1.92"
base64 = "0.23.1"
cron = "0.17.0"
daemonize = "0.5"
dirs = "5.0.1"
fs2 = "0.4.3"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
humantime = "2.4.0"
http-body-util = "0.1.5"
hyperlocal = "0.9.1"
libc = "0.2.191"
rpassword = "7.5.5"
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
shellexpand = "3.1.2"
thiserror = "1.0.69"
tokio-util = "0.7.20"
toml = "0.9.12"
tower = "0.5.3"
tracing = "0.1.44"
getrandom = "0.4.3"
argon2 = "0.6.0"
qrcodegen = "1.8.0"
schemars = "1.2.3"
tempfile = "3.27.0"

[dependencies.totp-rs]
version = "6.0.0"
default-features = false
features = [
    "std",
    "gen_secret",
    "otpauth",
]

[dependencies.pulldown-cmark]
version = "0.13.6"
default-features = false
features = ["html"]

[dependencies.axum]
version = "0.8.9"
features = ["macros"]

[dependencies.chrono]
version = "0.4.45"
features = [
    "serde",
    "unstable-locales",
]

[dependencies.chrono-tz]
version = "0.10.4"
features = ["serde"]

[dependencies.clap]
version = "4.6.9"
features = [
    "derive",
    "env",
]

[dependencies.hyper]
version = "1.12.0"
features = [
    "client",
    "http1",
]

[dependencies.hyper-util]
version = "0.1.21"
features = [
    "client",
    "client-legacy",
    "tokio",
    "http1",
]

[dependencies.url]
version = "2.5.9"

[dependencies.lettre]
version = "0.11"
default-features = false
features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.sqlx]
version = "0.9.1"
features = [
    "runtime-tokio",
    "any",
    "sqlite",
    "postgres",
    "tls-rustls-ring-webpki",
    "macros",
    "chrono",
    "migrate",
]

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = [
    "blocking",
    "rustls-tls",
    "json",
]

[dependencies.tokio]
version = "1.54.1"
features = ["full"]

[dependencies.rmcp]
version = "3.11.0"
default-features = false
features = ["server", "macros", "transport-io", "transport-streamable-http-server"]

[dependencies.mcp-web]
version = "0.3.0"
registry = "pandoras-box-cargo"

[dependencies.tracing-subscriber]
version = "0.3.23"
features = [
    "env-filter",
    "json",
]

[dev-dependencies]

[dev-dependencies.rmcp]
version = "3.11.0"
default-features = false
features = ["client", "transport-streamable-http-client-reqwest"]

# Password hashing is deliberately slow; unoptimized, as in every dev and test
# build, one argon2 hash costs about 20 times what it does optimized, and every
# test that hashes or checks a password pays it (CLAUDE-544). Release builds are
# already optimized, so this changes nothing in production.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
