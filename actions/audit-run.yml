---
# yaml-embedded-languages: nushell
# https://github.com/harrydowning/vscode-yaml-embedded-languages
# https://marketplace.visualstudio.com/items?itemName=harrydowning.yaml-embedded-languages

# Scheduled repository audits that file their findings (CLAUDE-214, CLAUDE-295).
#
# Same native handler as `youtrack.yml` (`kind: youtrack`, `src/native/youtrack.rs`); this file differs in which issues
# it picks up, which built-in prompt the agent gets, which projects it may create issues in, one dependency-gate setting,
# and automerge. Audit issues live in the `AUDIT` project, whose VCS processor points at the audits
# repo (e.g. `owner/audits`), so the handler clones the AUDITS repo into the job workdir and finalize opens the pull request
# there. The repository being audited is cloned read-only by the agent, outside the workdir, and is never written to.
#
# Prompt source: `prompt_preset: audit` selects the audit prompt compiled into the binary (`src/native/audit_prompt.rs`),
# so an image upgrade updates it. This file deliberately sets no `prompt:` key: a YAML `prompt` is a full-replacement
# override that wins over any preset and freezes the text at whatever the file says. `claude-run action show audit-run`
# prints `"prompt_source": "builtin:audit"` while the preset is in effect.
#
# The audit preset permits the tracker writes an audit needs and the engineering prompt forbids: filing the findings
# into the product projects in `write_projects` (CLAUDE-295), the `## Result` block on the run's own issue, one summary
# comment per target on the parent, and (daily parent run only) the standing table on anchor issue AUDIT-1. Every
# finding issue the run files gets `AI Agent = Queued` as its last write, so the `youtrack` action works it; that value,
# on issues the run created, is the only `AI Agent` write the agent may make. The 20-issue per-target cap is a prompt
# instruction: `AuditedTracker` bounds the runner's own provider calls, not the `yt` calls an agent makes. The filing
# procedure itself (dedup, grouping, priority, tags, links) lives in the audits repo, `prompts/_filing.md`.
#
# `AI Agent` and `State` on the triggering issue remain the runner's alone, so the state machine in `youtrack.yml`'s
# header applies here unchanged.
#
# Tag routing: the YouTrack workflow that files a day's audit tags the daily parent and every per-target Epic
# `Audit-<Type>`, and that tag is what routes them here. This query selects `project: AUDIT tag: Audit-*`;
# `youtrack.yml` selects the exact complement, `(project: -AUDIT or tag: -Audit-*)`, so exactly one action matches any
# queued issue (CLAUDE-215). An `AUDIT` issue with no `Audit-*` tag is ordinary engineering work on the audits repo and
# goes to `youtrack.yml`.
#
# The dependency gate (CLAUDE-161) is left on, which is what makes the daily parent wait: the workflow files one parent
# plus one Epic per target and queues all of them, and `parent for` blocks the parent until every Epic resolves.
# `block_cross_project: false` stops an Epic from waiting on its own findings: they are its subtasks but live in the
# product projects, so a retried Epic would otherwise stay blocked until every finding was worked.
#
# Automerge is on: an audit pull request only adds dated files to the audits repo, and it has to merge for its Epic to
# resolve, which is what releases the gated daily parent (whose run reads the per-target reports on the default branch).
# The merge is event-driven (CLAUDE-278), so the webhook backing this action must send Action Run Success and Recover.

name: audit-run

kind: youtrack

# Audits read a whole repository, so they run longer and cost more per job than a scoped issue. One target at a time,
# with a per-target issue cap enforced by the prompt, is what keeps a daily rotation affordable.
limits:
  max_attempts_per_key: 2
  max_runs_per_day: 20
  claude_timeout_seconds: 5400
  daily_budget_usd: 50.00

schedule:
  kind: interval
  spec: 5m

claude:
  allowed_tools: "Read,Edit,Write,Bash,Glob,Grep"
  permission_mode: acceptEdits

# Audits are the cost-control case: one run at a time, so a five-target day cannot fan out into five concurrent
# repository reads. Epics stay independently pickable, they just queue behind each other.
concurrency:
  max_parallel: 1

native:
  youtrack:
    # Audit runs only: the `AUDIT` project AND an `Audit-<Type>` tag (see the header). YouTrack rejects `-project: AUDIT`
    # with a parse error, so wherever a clause is negated (in youtrack.yml) the negation goes on the value.
    query: "-Resolved AI Agent: Queued project: AUDIT tag: Audit-*"
    custom_field: "AI Agent"
    # The built-in audit prompt (`src/native/audit_prompt.rs`). Do not add a `prompt:` key: it would override this.
    prompt_preset: audit
    # The product projects findings file into: the project mapping in the audits repo's `prompts/_filing.md`.
    write_projects:
      - BUNYIP
      - MAPPS
      - PMS
      - LC
      - SF
      - SFT
      - AB
    dependencies:
      block_cross_project: false
    # Merge the audit pull request once its CI is green, so the Epic resolves and the gated daily parent can run.
    automerge:
      enabled: true
  forgejo: {}
    # base_url / token_ref omitted, as in youtrack.yml: host `fj` credentials, forge host derived from the AUDIT
    # project's VCS integration.

link_template: "https://example.myjetbrains.com/issue/{key}"

output:
  file: audit-run.jsonl
