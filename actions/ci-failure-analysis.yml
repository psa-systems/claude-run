---
# Agentic CI-failure log analysis (CLAUDE-189).
#
# Native action (`kind: ci-failure-analysis`) routing to the built-in Rust
# handler in `src/native/ci_failure_analysis.rs`. This file is config only and
# carries no script-bearing fields (input.command / filter / pre / prompt /
# post).
#
# For every open, unresolved issue whose summary starts with `CI failure:` or
# `Auto-fix:` and that is not yet marked analyzed, the handler:
#   gather  -> yt list --query <query> --json, keep matching-prefix issues. The
#              selector is summary-prefix + analyzed-marker ONLY; it NEVER selects
#              by `AI Agent: Queued` (that field belongs to the code-fix runner in
#              actions/youtrack.yml).
#   resolve -> parse repo / run index / run URL / commit / workflow from the
#              issue's `## Failure` block. The run index is the number
#              `fj actions logs` takes, so nothing else has to be resolved.
#   fetch   -> pull the complete redacted run log (`fj actions logs --json`) plus
#              the failing workflow YAML into the workdir. A log miss posts a short
#              "unavailable" note once and leaves the issue un-marked for retry.
#   analyze -> one agentic `claude` session (Read,Grep,Bash) over both files.
#   finalize-> post the analysis as a YouTrack comment and mark the issue analyzed
#              so it is never analyzed twice (idempotent).
#
# Log reads shell out to `fj actions logs`; the workflow-YAML read stays on the
# REST API until `fj` gains a raw-file command (FJ-67). Both go through
# `forge_log` (Rust), never a raw REST call from a nu snippet (tooling-gap rule).
# Redaction is preserved end to end via `forge_log::redact`.

name: ci-failure-analysis

kind: ci-failure-analysis

native:
  # Master enable toggle (default true).
  enabled: true
  # YouTrack candidate query. MUST NOT filter by `AI Agent`; summary-prefix and
  # analyzed-marker filtering happens in the handler.
  query: "#Unresolved"
  # Summary prefixes an issue must start with to be analyzed.
  summary_prefixes:
    - "CI failure:"
    - "Auto-fix:"
  # Forgejo PAT (`read:repository` scope) used to fetch the run log through
  # `fj actions logs` and to read the workflow YAML. It reaches `fj` in a temp
  # single-host `keys.json` carrying that one secret and nothing else, never a
  # process argument. The candidate query spans every org, so the token is picked
  # per repo (CLAUDE-200).
  # Omitted here: the mapping is derived from `config.webhook.sources`, which
  # already holds one `log_token_ref` per org, so a token is rotated in one place
  # and ONE copy of this action serves every org. An issue whose repo maps to no
  # token is skipped with a warning (no "log unavailable" note is posted).
  #
  # To override, either name one secret for every repo:
  #   log_token_ref: forgejo-logs-contoso
  # or map per repo (exact `owner/repo`, `owner/*`, or `*`; first match wins):
  #   log_token_ref:
  #     - repos: ["contoso/*"]
  #       token_ref: forgejo-logs-contoso
  #     - repos: ["initech/*", "globex/*"]
  #       token_ref: forgejo-logs-initech
  # Cap (bytes) on the posted analysis comment.
  max_analysis_bytes: 24576

# /home has more space than /tmp.
workdir_base: ~/workspace

# The analysis session reads local files only.
claude:
  allowed_tools: "Read,Grep,Bash"
  permission_mode: acceptEdits

output:
  file: ci-failure-analysis.jsonl

# Poll on an interval, like the other native actions.
schedule:
  kind: interval
  spec: 30m

limits:
  max_attempts_per_key: 3
  max_runs_per_day: 50
  claude_timeout_seconds: 600
  daily_budget_usd: 5.00
