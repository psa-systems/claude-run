---
# Unattended Claude Code fix for failing CI on Forgejo PRs.
#
# Native action (CLAUDE-29, supersedes DEV-330): `kind: forgejo-ci-fix` routes
# to the built-in Rust handler in `src/native/forgejo_ci_fix.rs` instead of the
# generic nu-snippet pipeline. This file is config only and carries no
# script-bearing fields (input.command / filter / pre / prompt / post).
#
# Pipeline (all in typed Rust):
#   gather  -> per allow-listed repo, list open PRs (fj pr search --json) and
#              read head-commit CI status (fj pr status --json); keep PRs whose
#              combined CI state is `failure` and that were updated within
#              window_minutes. The dedup / attempt key is the PR head SHA.
#   filter  -> skip PRs authored by `bot_author` (anti-feedback-loop).
#   pre     -> git clone --branch <head_ref> --depth 50 (token auth from fj's
#              credential store; the clone stays a git subprocess).
#   claude  -> the action's `claude` block fixes the failing CI locally only.
#   post    -> decision gate (no_changes / too_big via max_files + max_lines /
#              push); on push, commit as the bot identity with the skip marker
#              and push the branch. A PR comment is posted on EVERY outcome path.
#
# All Forgejo reads and writes go through the `fj` CLI (no raw REST). Auth for
# clone / push reuses fj's own credential store at
# ~/.local/share/forgejo-cli/keys.json, so no token lives in YAML or env.
#
# DEPLOYMENT PREREQUISITE: the runner's `fj` must be a build that exposes
# `--json` on `pr search` (FJ-1) and `pr status` (FJ-2). An older `fj` without
# `--json` cannot drive the gather reads.

name: forgejo-ci-fix

kind: forgejo-ci-fix

# Typed config for the native handler. Every field defaults; `repos` is the
# allow-list of repositories to scan (empty means scan nothing).
native:
  host: dev.a8n.run
  repos:
    - contoso/claude-fix-sandbox
  # Only consider PRs updated within this many minutes of the run.
  window_minutes: 45
  # Decision gate: a diff over either cap is too large for an unattended push.
  max_files: 10
  max_lines: 300
  # Anti-feedback-loop: PRs authored by this login are skipped. Also the git
  # author identity used for the fix commit.
  bot_author: claude-run
  bot_email: claude-run@a8n.run
  # Appended to the fix commit message so the bot's own push does not
  # re-trigger this action.
  skip_marker: "[skip claude]"
  # token: inline plaintext placeholder for CLAUDE-26 (encrypted secrets); the
  # CLI backend uses fj's credential store today and ignores it.

# /home has more space than /tmp.
workdir_base: ~/workspace

claude:
  allowed_tools: "Read,Edit,Write,Bash,Glob,Grep"
  permission_mode: acceptEdits

output:
  file: forgejo-ci-fix.jsonl

limits:
  max_attempts_per_key: 3
  max_runs_per_day: 20
  claude_timeout_seconds: 600
  daily_budget_usd: 5.00
