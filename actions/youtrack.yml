---
# yaml-embedded-languages: nushell
# https://github.com/harrydowning/vscode-yaml-embedded-languages
# https://marketplace.visualstudio.com/items?itemName=harrydowning.yaml-embedded-languages

# Pick up YouTrack issues whose AI Agent custom field is Queued. Resolve each
# issue's repo via the project's VCS integration, clone it into the row's
# workdir, and have Claude work the issue end-to-end per the YouTrack and Git
# workflows in CLAUDE.md.
#
# Auth: yt CLI is host-configured. No tokens in YAML.
#
# Requires yt 0.3.0+ (project vcs, issue get-field, issue set-field).
#
# AI Agent state machine:
#   Queued       -> picked up by this action
#   Working      -> claude is running (set in pre step)
#   Code Review  -> claude opened a PR, the code needs human review (post step)
#   Needs Review -> claude couldn't proceed, the issue needs human input (post step)
#                   - attempt counter is NOT incremented (parked, not failed)
#   Failed       -> claude or a step had a hard failure (post step)
#   Done         -> PR merged; human or commit trailer transitions State here

name: youtrack

# /home has more space than /tmp.
# Plain shell expansion: ~, $VAR, and ${VAR} are honored. The old nu-eval
# form ($"...") is gone with the Rust port.
workdir_base: ~/workspace

input:
  command: |
    #!/usr/bin/env nu
    # --query=VAL (not --query VAL): the YouTrack query starts with `-Resolved`
    # which clap (yt arg parser) would otherwise read as an unknown short flag and bail.
    let issues_raw = (^yt list --query='-Resolved AI Agent: Queued' --json | complete)
    if $issues_raw.exit_code != 0 {
        print --stderr $"yt list failed: ($issues_raw.stderr)"
        exit 1
    }
    let issues = ($issues_raw.stdout | from json)

    # Resolve each project's enabled VCS processor once per project key.
    # Cached so N issues in the same project make one yt project vcs call.
    let project_keys = ($issues | each { |i| $i.idReadable | split row "-" | first } | uniq)
    let proj_map = ($project_keys | reduce --fold {} { |key, acc|
        let r = (^yt project vcs $key --enabled-only --json | complete)
        if $r.exit_code != 0 {
            return ($acc | upsert $key null)
        }
        let procs = (try { $r.stdout | from json } catch { [] })
        if ($procs | is-empty) {
            return ($acc | upsert $key null)
        }
        let p = ($procs | first)
        let host = ($p.serverUrl | str trim --right --char "/")
        $acc | upsert $key {repo_host: $host, repo_path: $p.path, clone_url: $"($host)/($p.path).git"}
    })

    # Drop issues whose project has no enabled VCS integration; they cannot be
    # cloned and would just fail in the pre step.
    let rows = ($issues | each { |i|
        let key = ($i.idReadable | split row "-" | first)
        let repo = ($proj_map | get -o $key)
        if $repo == null { return null }
        $i | merge $repo
    } | compact)

    $rows | to json

dedup_key: idReadable

filter: |
  #!/usr/bin/env nu
  # Belt-and-suspenders: query already filters to Queued, but if a race lets a
  # Working/Done issue through, skip it.
  let ai_agent = ($row | get -o "AI Agent" | default "")
  if $ai_agent != "Queued" {
      print --stderr $"skipping ($row.idReadable): AI Agent = ($ai_agent)"
      exit 1
  }

pre:
  # Mark the issue Working so concurrent or subsequent runs do not pick it up.
  - |
    #!/usr/bin/env nu
    ^yt issue set-field $row.idReadable "AI Agent" "Working"
    ^yt issue set-state $row.idReadable "In Progress"

  # Clone the repo into the row's workdir. Host git identity handles auth.
  # Runner already created $workdir as an empty dir. If a previous attempt
  # left state behind, git clone will fail; the attempt counter trips after
  # max_attempts_per_key and a human is expected to investigate $workdir.
  - |
    #!/usr/bin/env nu
    ^git clone --depth 50 $row.clone_url $workdir

prompt: |
  #!/usr/bin/env nu
  let lines = [
      "You are working a YouTrack issue end-to-end. Follow the YouTrack and Git workflows from CLAUDE.md.",
      "",
      $"Issue: ($row.idReadable): ($row.summary)",
      $"Repo: ($row.clone_url)",
      $"Working directory: ($workdir) - the repo is already cloned here, you are inside it.",
      "",
      "Steps:",
      $"1. Run 'yt issue inspect ($row.idReadable)' to read the full description and acceptance criteria.",
      "2. Create a feature branch off the default branch per the Git workflow in CLAUDE.md.",
      "3. Make the minimum change required to satisfy the acceptance criteria.",
      $"4. Commit with a message ending in the YouTrack command trailer '#($row.idReadable) State Done' so the issue auto-transitions when the PR merges.",
      "5. Push the branch and open a PR with the issue id in both the title and the body.",
      "6. Set AI Agent to 'Code Review' so the human knows the PR is waiting on them:",
      $"     yt issue set-field ($row.idReadable) 'AI Agent' 'Code Review'",
      "7. Stop after the PR is opened. Do not merge.",
      "",
      "If you CANNOT safely complete the issue - missing context, ambiguous acceptance criteria, out-of-scope work, dependency on another issue:",
      "  a. Do NOT change any code.",
      "  b. Post a comment on the issue explaining exactly what information or decision you need from a human to proceed.",
      "  c. Set AI Agent to 'Needs Review' (the ISSUE needs human input - distinct from 'Code Review' which means a PR is waiting):",
      $"       yt issue set-field ($row.idReadable) 'AI Agent' 'Needs Review'",
      "  d. Touch this marker file so the runner does NOT count this attempt toward the per-key cap (the row is parked pending human input, not failed):",
      $"       touch ($workdir)/.claude-run-skip-attempt",
      "",
      "When you finish, summarize what you did and the PR URL (if any) in plain text.",
  ]
  $lines | str join "\n"

claude:
  allowed_tools: "Read,Edit,Write,Bash,Glob,Grep"
  permission_mode: acceptEdits

post:
  # Comment the run summary on the issue. Post always runs, even when claude
  # failed (timeout, error), so branch the header text on $claude_result.ok.
  - |
    #!/usr/bin/env nu
    let header = if $claude_result.ok {
        "Claude AI agent run summary:"
    } else {
        $"Claude AI agent run FAILED \(($claude_result.error)\):"
    }
    let lines = [$header, "", $claude_result.summary, "", $"Cost: $($claude_result.cost) USD"]
    let body = ($lines | str join "\n")
    ^yt issue comment $row.idReadable $body

  # Transition AI Agent out of Working so the row is not stuck.
  # If Claude self-set the field (Code Review / Needs Review / Failed) we
  # preserve it. Only act when current value is still Working - meaning Claude
  # never got to step 6 or the failure path.
  # success path (claude_result.ok) but no self-flag -> default to Code Review
  # failure path (timeout, crash) -> Failed
  #
  # Also: if Claude set Needs Review (blocker), make sure the skip-attempt
  # marker is in place so the runner doesn't tick the per-key attempt counter.
  # Claude is told to touch the marker in the prompt, but belt-and-suspenders.
  - |
    #!/usr/bin/env nu
    let r = (^yt issue get-field $row.idReadable "AI Agent" | complete)
    let current = if $r.exit_code == 0 { $r.stdout | str trim } else { "" }

    if $current == "Working" {
        let target = if $claude_result.ok { "Code Review" } else { "Failed" }
        ^yt issue set-field $row.idReadable "AI Agent" $target
    }

    let final_state = (^yt issue get-field $row.idReadable "AI Agent" | complete | get stdout | str trim)
    if $final_state == "Needs Review" {
        let marker = $"($workdir)/.claude-run-skip-attempt"
        if not ($marker | path exists) {
            touch $marker
        }
    }

output:
  file: youtrack.jsonl

limits:
  max_attempts_per_key: 3
  max_runs_per_day: 20
  claude_timeout_seconds: 3600
  daily_budget_usd: 20.00
