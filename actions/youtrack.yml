---
# yaml-embedded-languages: nushell
# https://github.com/harrydowning/vscode-yaml-embedded-languages
# https://marketplace.visualstudio.com/items?itemName=harrydowning.yaml-embedded-languages

# Pick up YouTrack issues whose AI Agent custom field is Queued. Resolve each issue's repo via the project's VCS
# integration, clone it into the job's workdir, and have Claude work the issue end-to-end per the YouTrack and Git
# workflows in CLAUDE.md.
#
# Native action (CLAUDE-33): `kind: youtrack` routes to the built-in Rust handler in `src/native/youtrack.rs` instead of
# the generic nu-snippet pipeline. The handler owns gather / filter / pre / prompt / claude / finalize in typed Rust;
# this file is config only and carries no script-bearing fields (input.command / filter / pre / prompt / post).
#
# Auth (CLAUDE-26): the `yt` / `fj` CLIs are host-configured by default. To give this action its own credentials, set
# `token_ref` under the native blocks to the name of an encrypted secret (managed under /secrets in the web UI;
# encrypted at rest with the age key file named by CLAUDE_RUN_SECRETS_KEY_FILE). The runner decrypts it at run time and
# injects it into the CLIs per job; no raw token is ever written to this file. With no `token_ref`, host credentials are
# used.
#
# AI Agent state machine (labels configurable under native.youtrack.states):
#   Queued       -> picked up by this action
#   Working      -> claude is running (set in the pre step)
#   Code Review  -> a successful run's PR passed the post-success review session (below) and was promoted out of
#                   draft; the code needs human review (finalize step)
#   Needs Review -> claude couldn't proceed and parked the job by writing .claude-run-needs-review; the issue needs
#                   human input (finalize step) - the attempt counter is NOT incremented. A timeout also lands here
#                   even when a checkpoint push (below) already salvaged the work into a draft PR - CLAUDE-453 tracks
#                   auto-requeuing a timeout back to Queued instead, as a deliberately descoped follow-up of CLAUDE-448.
#                   The post-success review session (below) also lands here when it gave no usable verdict, and when
#                   a real fail verdict's attempt count has reached max_attempts_per_key
#   Failed       -> claude or a step had a hard failure (finalize step)
#   Done         -> a run that deliberately produced tracker output rather than code and wrote
#                   .claude-run-no-code-change; no PR is opened and State is left alone (CLAUDE-214, label configurable
#                   as native.youtrack.states.no_code)
#
# Checkpoint pushes (CLAUDE-448): while claude is running, the runner pushes the feature branch's current commits
# every 60 seconds with hooks skipped (--no-verify on the checkpoint push only, never on the final push a successful
# run makes), so a killed or timed-out run still leaves its work reachable on the forge. The first successful
# checkpoint push opens a draft PR (salvaged=true, same CLAUDE-398/CLAUDE-379 body shape as a timeout salvage, but
# with no Closes line since the run is still going) and every push after that posts a `checkpoint push` PR comment
# (CLAUDE-447). A run that resolves normally afterwards promotes that draft PR exactly like a resumed run does
# (CLAUDE-429): refresh_pr_text + mark_pr_ready, salvaged cleared. If a checkpoint push is ever rejected by the forge
# (for example a force-pushed or deleted branch), the watcher logs it, stops checkpointing for the rest of the run,
# never fails the job over it, and the rejection is named in whichever outcome comment finalize posts. The default
# branch is never checkpoint-pushed. Only the Forgejo (`fj`) backend implements checkpoint_push today; CLAUDE-452
# tracks the GitHub backend as a deliberately descoped follow-up.
#
# Post-success review session (CLAUDE-449): a successful run's PR is always opened as a draft first. Before promoting
# it, the runner spends a second, separate-context claude invocation reviewing the same workdir read-only
# (allowed_tools forced to Read,Glob,Grep,Bash regardless of this file's own claude.allowed_tools; its own timeout,
# limits.review_timeout_seconds below; the run's remaining spend ceiling). A pass (.claude-run-review-pass) promotes
# the draft to ready and folds the verdict notes into the success comment. A fail (.claude-run-review-fail) leaves the
# PR a draft, posts the findings on the PR and the issue, counts the attempt, and requeues to Queued below
# max_attempts_per_key or parks at Needs Review at the cap - either way the built-in prompt's resume step (below)
# tells the agent to read the PR's comments and fix what the review found. No marker, both markers, a timeout, or the
# review session touching the workdir all collapse to no usable verdict, which always parks at Needs Review instead.
#
# Working can also revert to Queued (CLAUDE-439), with a comment naming the reason and no attempt counted: a transient
# claude result (an authentication failure, or a rate-limit / usage-limit signal) after the pre step already wrote
# Working; or a global pause / the Claude login needing renewal tripping the run after the pre step but before claude
# started. Either way the re-read before the revert checks the field is still Working first, so a concurrent manual
# edit or a second runner instance is never stomped back to Queued; a run already stopped before the pre step writes
# nothing at all, not even the live AI Agent re-read's own side effects. An operator cancel in that same window is
# unaffected and still finalizes as Failed.
#
# The agent does ONLY local engineering work on code (read issue, branch, change, commit locally, run the repo's
# checks): no git push and no PR. Since the checkpoint-push watcher above publishes the agent's commits while it is
# still running (CLAUDE-465), the agent is told never to rewrite that branch's history (no reset, --amend, rebase,
# filter-branch, or force push) to fix a mistake; a new commit on top is the only way, so a checkpoint already on the
# remote is never orphaned. Since CLAUDE-214 it may also make bounded tracker writes, in two cases (CLAUDE-297
# split these): a gap, deferred item, or descoped piece of the triggering issue is filed in
# native.youtrack.write_projects (defaulting to the triggering issue's own project) and linked relates to (or depends
# on / is required for when one genuinely blocks the other), never subtask of, the triggering issue (CLAUDE-454:
# subtask of is reserved for linking under an epic or milestone root, since making a work issue the parent lets
# closing the follow-up auto-close it and lets the dependency gate block the parent on its own child); a bug found
# outside the triggering issue's scope is filed in the project whose VCS integration binds the buggy repo (falling
# back to native.youtrack.write_projects) and linked relates to the triggering issue. Neither case files a follow-up
# whose only purpose is to verify, once the triggering issue's own PR exists, that infrastructure or configuration
# outside the PR took effect, or one that can only start once that PR is open or merged; the agent also checks for a
# link cycle before creating either link and skips the link if one would result.
# Either way the agent may update / comment on / link only the issues it created this run, so a gap or bug it finds
# becomes a tracked issue rather than a line of prose. The agent may also comment on the triggering issue itself; the
# runner still posts its own outcome comment on it. Everything else stays the handler's: the AI Agent field on ANY issue, and every
# other write to the triggering issue (description/summary, tags, assignee, state, fields). The finalize step owns PR
# creation and the AI Agent transition
# and runs them after the claude process exits, gated on the run outcome. The agent signals a blocker by writing
# .claude-run-needs-review (reason text) + .claude-run-skip-attempt.
#
# State (the standard YouTrack field) is independent of AI Agent. The pre step sets State=In Progress. Submitting a PR
# does NOT move State to Done: the commit links the PR to the issue but carries no State command, so the issue stays In
# Progress until a human merges the PR and sets State=Done themselves.

name: youtrack

kind: youtrack

limits:
  max_attempts_per_key: 3
  max_runs_per_day: 100
  claude_timeout_seconds: 3600
  review_timeout_seconds: 1800
  daily_budget_usd: 150.00

schedule:
  kind: interval
  spec: 5m

claude:
  allowed_tools: "Read,Edit,Write,Bash,Glob,Grep"
  permission_mode: acceptEdits

# CLAUDE-28: run independent issues in parallel. Each issue's project/repo forms the concurrency key (workflow is unset
# today), so issues in different repos run concurrently while issues in the same repo serialize (they would otherwise
# collide on the clone dir, branch, and PR). max_parallel caps how many distinct repos run at once; keep it at or below
# the host's spare core count, since each running issue holds a thread for its Claude invocation. Set to 1 to restore
# the previous strictly-sequential behavior.
concurrency:
  max_parallel: 4

# Typed config for the native handler. Every field defaults, so an empty `native: {}` reproduces the behavior the
# scripted action had; the youtrack block below pins the query and custom field explicitly for documentation.
native:
  youtrack:
    # --query value the handler passes to `yt list`, sent as `--query=<value>` so a query starting with `-` is not
    # mistaken for a flag.
    #
    # Audit partition (CLAUDE-215): the exact complement of `audit-run.yml`'s `project: {{audit_project}} tag: Audit-*`
    # (tag routing is in its header). Negate values, not keys (`-project:` is a parse error); a `(...)` group needs an
    # explicit `and`. `{{audit_project}}` is substituted with `audit_project` below (default `AUDIT`, CLAUDE-409); it
    # must be set to the SAME value as `audit-run.yml`'s so the two queries stay an exact complement.
    #
    # The reporting action (`closed-issue-summary.yml`, CLAUDE-218) is partitioned off the same way
    # but on the `AI Agent` axis rather than the project axis: this query pins the single value
    # `Queued`, and a reporting parent carries a DIFFERENT `AI Agent` value, so one issue can never
    # match both actions (the field holds one value at a time). No negation is written here on
    # purpose. YouTrack rejects a query naming an `AI Agent` value that is not in the bundle with
    # HTTP 400 rather than returning nothing, so spelling the reporting value out would break THIS
    # action's poll until someone added that value in YouTrack. `shipped_action_queries_are_disjoint`
    # in src/action.rs is the mechanical guard on the partition.
    query: "(project: -{{audit_project}} or tag: -Audit-*) and -Resolved AI Agent: Queued"
    custom_field: "AI Agent"
    # Short name of the audit project. Must match `audit-run.yml`'s `audit_project`; see actions/SCHEMA.md.
    audit_project: AUDIT
    # base_url / token_ref (CLAUDE-26): omitted here, so the host-configured yt CLI is used. To inject a token, set
    # base_url plus token_ref: <secret-name>.
    # states: defaults to Queued / Working / Code Review / Needs Review / Failed and State=In Progress; override here
    #         only if the project renames these AI Agent values.
  forgejo: {}
    # base_url / token_ref (CLAUDE-26): omitted, so the host fj credentials are used and the forge host derives from
    # each issue's resolved VCS integration.

output:
  file: youtrack.jsonl
